name: Python pre-commit checks.
on:
  push:
    branches: [ "main" ]
    paths:
      - '**.py'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.py'

permissions:
  contents: read

jobs:
  pre-commit-checks:
    name: |
      Run `black`, `basedpyright`, `mypy`, `pyrefly`, and `pytest`.
      Commits any changes made by `black`.
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push new commits.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7
        with:
          # Ensure we are on the PR branch, not a detached head
          ref: ${{ github.head_ref }}
          # Required to push new commits.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install basedpyright black mypy
          pip install -r requirements.txt

      # keep-sorted start block=true
      - name: Run basedpyright
        run: basedpyright .
      - name: Run black
        run: black .
      - name: Run mypy
        run: mypy --ignore-missing-imports --scripts-are-modules .
      - name: Run pyrefly
        uses: facebook/pyrefly@main
      - name: Run pytest
        run: pytest
      # keep-sorted end

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          commit_message: "style: automatic black fixes"
          file_pattern: '**.py'
