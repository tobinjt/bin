- repo: local
  hooks:
  - id: markdownlint
    name: Run `markdownlint`
    priority: linter
    language: system
    types:
    - markdown
    exclude: CODE_OF_CONDUCT.md
    entry: markdownlint
- repo: local
  hooks:
  - id: mermaid-pre-commit
    name: Run `mermaid-pre-commit`
    priority: linter
    language: system
    types:
    - markdown
    entry: mermaid-pre-commit
