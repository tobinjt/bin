#!/usr/bin/env -S "populate_pre_commit"
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# managed-by-populate-pre-commit start: header
# Placeholder
# managed-by-populate-pre-commit end: header

repos:
  # managed-by-populate-pre-commit start: actionlint.yaml
  - repo: local
    hooks:
    - id: actionlint
      name: Run `actionlint`
      language: system
      types:
      - yaml
      exclude: dependabot.yml|.*.yaml$
      entry: actionlint
  # managed-by-populate-pre-commit end: actionlint.yaml
  # managed-by-populate-pre-commit start: always_enabled.yaml
  - repo: meta
    hooks:
    - id: check-hooks-apply
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
    - id: conventional-pre-commit
      stages:
      - commit-msg
      args:
      - --verbose
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-case-conflict
    - id: check-executables-have-shebangs
    - id: check-illegal-windows-names
    - id: check-merge-conflict
    - id: check-vcs-permalinks
    - id: check-yaml
    - id: destroyed-symlinks
    - id: fix-byte-order-marker
    - id: mixed-line-ending
  - repo: local
    hooks:
    - id: make_github_workflows
      name: Run `make_github_workflows`
      language: system
      always_run: true
      pass_filenames: false
      entry: env ./.github/dependabot.yml
  - repo: local
    hooks:
    - id: populate_pre_commit
      name: Run `populate_pre_commit`
      language: system
      always_run: true
      pass_filenames: false
      entry: env ./.pre-commit-config.yaml
  - repo: local
    hooks:
    - id: spellcheck
      stages:
      - commit-msg
      name: Check spelling
      language: system
      verbose: true
      entry: spell-check-wrapper
  # managed-by-populate-pre-commit end: always_enabled.yaml
  # managed-by-populate-pre-commit start: json.yaml
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-json
      exclude: ^\.vscode/settings\.json|package-lock\.json$
    - id: pretty-format-json
      exclude: ^\.vscode/settings\.json|package-lock\.json$
      args:
      - --autofix
  # managed-by-populate-pre-commit end: json.yaml
  # managed-by-populate-pre-commit start: markdown.yaml
  - repo: local
    hooks:
    - id: markdownlint
      name: Run `markdownlint`
      language: system
      types:
      - markdown
      exclude: CODE_OF_CONDUCT.md
      entry: markdownlint
  - repo: local
    hooks:
    - id: mermaid-pre-commit
      name: Run `mermaid-pre-commit`
      language: system
      types:
      - markdown
      entry: mermaid-pre-commit
  # managed-by-populate-pre-commit end: markdown.yaml
  # managed-by-populate-pre-commit start: mdformat.yaml
  - repo: local
    hooks:
    - id: mdformat
      name: Run `mdformat`
      language: system
      types:
      - markdown
      exclude: ^(CODE_OF_CONDUCT\.md|README\.md)$
      entry: mdformat
  # managed-by-populate-pre-commit end: mdformat.yaml
  # managed-by-populate-pre-commit start: pytest.yaml
  - repo: local
    hooks:
    - id: pytest
      name: Run `pytest`
      language: system
      pass_filenames: false
      types:
      - python
      entry: pytest
      args:
      - -o
      - pythonpath=.venv/lib/python3.14/site-packages
  # managed-by-populate-pre-commit end: pytest.yaml
  # managed-by-populate-pre-commit start: python.yaml
  - repo: local
    hooks:
    - id: basedpyright
      name: Run `basedpyright`
      language: system
      types:
      - python
      entry: basedpyright
  - repo: local
    hooks:
    - id: black
      name: Run `black`
      language: system
      types:
      - python
      entry: black
  - repo: local
    hooks:
    - id: mypy
      name: Run `mypy`
      language: system
      types:
      - python
      entry: mypy --ignore-missing-imports --scripts-are-modules
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
    - id: python-check-blanket-noqa
    - id: python-check-blanket-type-ignore
    - id: python-check-mock-methods
    - id: python-no-eval
    - id: python-no-log-warn
    - id: python-use-type-annotations
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.3.2
    hooks:
    - id: pyrefly-check
      name: Pyrefly (type checking)
      pass_filenames: false
      language: system
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: debug-statements
  # managed-by-populate-pre-commit end: python.yaml
  # managed-by-populate-pre-commit start: shellcheck.yaml
  - repo: local
    hooks:
    - id: shellcheck
      name: Run `shellcheck`
      language: system
      types:
      - shell
      entry: shellcheck -e SC1090 -e SC1091
  # managed-by-populate-pre-commit end: shellcheck.yaml
  # managed-by-populate-pre-commit start: toml.yaml
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-toml
  # managed-by-populate-pre-commit end: toml.yaml
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-builtin-literals
        files: python/.*\.py$
      - id: check-docstring-first
        files: python/.*\.py$
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: debug-statements
        files: python/.*\.py$
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      # keep-sorted start
      - id: actionlint
        name: Run `actionlint`
        language: system
        types: [yaml]
        exclude: dependabot.yml|.*.yaml$
        entry: actionlint
      - id: pytest - triggered by Github workflows changing
        name: Run `pytest` when Github workflows change
        language: system
        pass_filenames: false
        types: [yaml]
        entry: pytest
      # keep-sorted end
